# Cấu hình các mô hình AI: Detection, Depth, OCR, VQA
detection:
  model_name: "yolov8n"
  weights_path: "models/weights/yolov8n.pt"
  fallback_weights_path: "models/weights/yolov8n.pt" # dùng khi weights_path không có trên máy
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: "mps" # mps | cpu
  input_size: 640
  # 21 lớp COCO trong nhà theo kế hoạch
  enabled_classes:
    - "person"
    - "cat"
    - "dog"
    - "chair"
    - "couch"
    - "bed"
    - "dining table"
    - "tv"
    - "laptop"
    - "keyboard"
    - "mouse"
    - "cell phone"
    - "bottle"
    - "cup"
    - "bowl"
    - "book"
    - "clock"
    - "vase"
    - "microwave"
    - "oven"
    - "toaster"
    - "sink"
    - "refrigerator"
    - "toilet"
    # [Cải tiến] vật cản thường gặp trên lối đi mà bản gốc chưa bật
    - "bench"
    - "potted plant"
    - "suitcase"
    - "bicycle"
    - "motorcycle"
    - "backpack"
  # Nhóm đối tượng có thể gây va chạm cần kích hoạt cảnh báo nguy cơ
  alert_classes:
    - "person"
    - "dog"
    - "cat"
    - "chair"
    - "couch"
    - "bed"
    - "dining table"
    - "refrigerator"
    - "toilet"
    - "sink"
    - "tv"
    # [Cải tiến] bỏ "laptop", "cell phone" (vật nhỏ trên bàn - cái bàn mới là vật cản);
    # thêm vật cản thấp/trên lối đi
    - "bench"
    - "potted plant"
    - "suitcase"
    - "bicycle"
    - "motorcycle"
    - "backpack"

# [Cải tiến] Theo vết: bytetrack (Kalman + ghép 2 tầng, src/tracking/bytetrack.py) | iou (bản gốc)
tracking:
  type: "bytetrack"
  low_threshold: 0.10   # detection 0.10-0.25 chỉ dùng để NỐI TIẾP track (ảnh nhoè chuyển động)
  first_match_iou: 0.2
  second_match_iou: 0.5
  max_lost_sec: 1.0

depth:
  # Metric-Indoor cho khoảng cách theo mét. Bản relative (Depth-Anything-V2-Small-hf +
  # representation: relative_depth) chuẩn hoá theo frame nên bỏ sót vật gần
  # (NYU: chỉ 16% vật trong 1.5 m được HIGH) -> xem evaluation/REAL_DATA_EVALUATION.md.
  model_name: "depth_anything_v2_metric_indoor_small"
  hf_repo_id: "depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf"
  device: "mps" # mps | cpu
  representation: "metric_depth" # relative_depth | metric_depth
  # Hệ số nhân mét. Model ước lượng xa hơn thực tế, độ lệch tuỳ camera/độ phân giải.
  # 0.60 đo trên NYU (Kinect) ở 256px; hãy hiệu chỉnh lại bằng scripts/calibrate_depth.py.
  metric_scale: 0.60
  percentile_roi: 80 # lấy phân vị 80% trong vùng ROI đã co viền
  roi_erosion_ratio: 0.15 # co viền 15% để tránh nhiễu phông nền
  input_height: 256 # kích thước suy luận tối ưu cho Apple Silicon (50ms ~ 20 FPS)
  input_width: 256
  # Lưu ý: bộ tiền xử lý Depth Anything giữ tỉ lệ ảnh (keep_aspect_ratio) nên 256x256 với ảnh
  # 640x480 thực chất là 252x336 - KHÔNG bị ép vuông (đính chính nhận xét phản biện trước đó).
  # [Cải tiến] Tự hiệu chỉnh hệ số mét theo mặt sàn mỗi frame (src/depth/floor_model.py);
  # metric_scale ở trên chỉ còn là giá trị dự phòng khi chưa thấy sàn.
  auto_scale:
    enabled: true
    min_inlier_ratio: 0.45
    ema_alpha: 0.25

ocr:
  engine: "vision" # vision (macOS) | easyocr
  languages: ["vi", "en"]
  device: "mps" # mps | cpu
  min_confidence: 0.3
  blur_laplacian_threshold: 60.0 # dưới ngưỡng này cảnh báo ảnh mờ
  min_brightness: 40.0 # dưới ngưỡng này cảnh báo ảnh quá tối
  max_brightness: 240.0 # trên ngưỡng này cảnh báo lóa sáng
  read_timeout_sec: 10.0 # Vision không trả về trong thời gian này -> chuyển sang EasyOCR
  filter_garbage: true # [Cải tiến] bỏ chuỗi ký hiệu/ký tự lẻ độ tin cậy thấp trước khi đọc ra loa

vqa:
  backend: "mlx_vlm" # legacy_caption | disabled | mlx_vlm
  use_vlm: true
  caption_model_name: "Salesforce/blip-image-captioning-base"
  translation_model_name: "Helsinki-NLP/opus-mt-en-vi"
  device: "mps" # mps | cpu
  max_tokens: 45
  answer_style: "ngan" # [Cải tiến] ngan = trả lời thẳng, bỏ tiền tố "Khung cảnh:" | goc
  guardrail:
    mode: "mo_rong"    # [Cải tiến] mo_rong | regex (bản gốc)
  mlx_vlm:
    # Repo ID chỉ được script download_models.py sử dụng, không dùng ở runtime.
    hf_repo_id: "mlx-community/Qwen2.5-VL-3B-Instruct-4bit"
    model_path: "models/weights/qwen2_5_vl_3b_4bit" # tương đối từ project root
    max_image_size: 512 # cạnh dài nhất, giữ tỉ lệ và toàn bộ khung hình; cap 512
    max_tokens: 128 # cap 128; cho phép 1-2 câu nhưng vẫn giới hạn độ trễ trên M1 16GB
