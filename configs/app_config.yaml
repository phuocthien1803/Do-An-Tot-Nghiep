# Cấu hình runtime và phần cứng của ứng dụng
app:
  name: "Local Multimodal Assistive System"
  version: "1.0.0"
  device: "mps" # mps | cpu
  log_level: "INFO"

camera:
  source: 0 # 0 for default webcam, or path to video file, or "dummy"
  width: 640
  height: 480
  fps: 30
  buffer_size: 2 # drop-oldest bounded buffer limit
  reconnect_delay_sec: 2.0
  max_reconnect_attempts: 5
  # [Cải tiến] Hình học camera cho tự hiệu chỉnh độ sâu theo mặt sàn (depth.auto_scale).
  height_m: 1.3   # độ cao camera so với sàn khi đeo trước ngực (mét) - đo lại cho người dùng thật
  hfov_deg: 70.0  # trường nhìn ngang (độ); webcam laptop ~ 60-75, iPhone 1x ~ 70

runtime:
  detection_interval_ms: 66 # ~15 FPS
  depth_interval_ms: 125 # ~8 FPS
  watchdog_timeout_sec: 3.0
  # [Cải tiến] Khởi động thích ứng: chờ tối đa N giây cho detection/depth ra kết quả đầu tiên
  # trước khi báo "gián đoạn" (máy chậm từng báo lỗi giả lúc khởi động). null = như gốc (5 s cố định).
  startup_grace_max_sec: 30.0
  # [Cải tiến] Ảnh quá tối/ống kính bị che (độ sáng trung bình < ngưỡng, 0-255): coi dữ liệu là
  # DEGRADED và đọc thông báo; bản gốc vẫn tin độ sâu trên ảnh đen. 0 = tắt (như gốc).
  min_frame_brightness: 15
  torch_threads: null # số luồng CPU cho PyTorch (null = mặc định); Windows CPU đặt 4
  enable_preview: true
  preview_width: 800
  preview_height: 600

audio:
  enabled: true
  engine: "say" # say (macOS native) | dummy
  voice: "Linh" # Vietnamese voice on macOS
  speech_rate_wpm: 200
  enable_chimes: true
  min_alert_interval_sec: 2.0
  # [Cải tiến] Âm báo lập thể ngắn (< 100 ms) trước lời cảnh báo, lệch trái/phải theo hướng vật.
  earcons: true

# [Cải tiến] Kênh âm thanh an toàn - xem src/audio/safety_channel.py
safety:
  # Cảnh báo HIGH khi đang ở chế độ OCR/VQA:
  #   off    = như bản gốc (tắt hết cho tới khi bấm C)
  #   earcon = chỉ tiếng bíp theo hướng, không chen lời nói (mặc định bản cải tiến)
  #   speech = vẫn đọc lời cảnh báo, ngắt kết quả OCR/VQA
  on_demand_high_alert: "earcon"
  beeper: true            # tiếng tích nhịp nhanh dần theo TTC (kiểu cảm biến lùi xe)
  ticks_in_warning: true
  ticks_in_on_demand: true

# [Cải tiến] Hỏi bằng giọng nói (phím V), offline. Cần: pip install sounddevice faster-whisper
# và python scripts/download_models.py --asr. Thiếu thì hệ thống nói rõ và vẫn dùng phím Q.
asr:
  enabled: true
  model_size: "small"
  model_path: "models/weights/faster_whisper_small_model"
  record_sec: 5.0
  device: "cpu"
  compute_type: "int8"

ui:
  theme: "dark_hud" # dark_hud
  show_depth_map: true
  show_spatial_guides: true
  show_diagnostics: true
  auto_return_warning_sec: 10.0 # [Cải tiến] tự về chế độ Cảnh báo sau OCR/VQA (0 = như gốc, chờ phím C)
  headless_keyboard: true       # [Cải tiến] --no-gui vẫn điều khiển bằng bàn phím console
  global_hotkeys: false         # [Cải tiến] phím tắt toàn hệ thống (cần pip install pynput)
  # [Cải tiến] Điều khiển MỘT NÚT cho người khiếm thị (src/ui/one_button.py). Nút chụp ảnh Bluetooth
  # (~50-100 nghìn đồng) thường gửi "media_volume_up" hoặc "enter" -> cần global_hotkeys: true để
  # nhận khi cửa sổ không được chọn. Thử trên bàn phím bằng phím B.
  one_button:
    enabled: true
    keys: ["b", "enter", "media_volume_up", "media_play_pause"]
    multi_click_sec: 0.45   # khoảng chờ giữa các lần bấm của cùng một cử chỉ
    long_press_sec: 0.7
    actions: {single: "vqa", double: "ocr", triple: "find", long: "stop_or_warning"}

# [Cải tiến] Chế độ TÌM ĐỒ dẫn hướng bằng âm thanh lập thể (phím F / bấm nút 3 lần / nói "tìm cái cốc")
find:
  enabled: true
